name: Veronica
options:
  bundleIdPrefix: com.tristan.veronica
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 13.0
targets:
  Veronica:
    type: application
    platform: macOS
    sources:
      - path: Veronica/Sources
        excludes:
          - "*.backup-*"
      - path: Assets.xcassets
      - path: Veronica/Resources/Engine
        type: folder
        buildPhase: resources
      - path: Veronica/Resources/AppIcon.icns
        buildPhase: resources
      - path: Veronica/Resources/Runtime
        type: folder
        buildPhase: resources
      - path: Veronica/Resources/Tools
        type: folder
        buildPhase: resources
      - path: Veronica/Resources/VeronicaEngine
        type: folder
        buildPhase: resources
    info:
      path: Veronica/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: Veronica
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIconFile: AppIcon
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Tristan Van Garsse. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tristan.veronica
        PRODUCT_NAME: Veronica
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.13.5
