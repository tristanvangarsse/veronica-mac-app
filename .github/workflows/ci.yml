name: CI
on:
  push:
  pull_request:

jobs:
  engine-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: python -m pip install Pillow==11.3.0

      - name: Install media dependencies
        run: brew install ffmpeg handbrake

      - name: Verify media dependencies
        run: |
          ffmpeg -version
          ffprobe -version
          HandBrakeCLI --version

      - name: Synchronize bundled engine
        run: bash scripts/sync_engine_bundle.sh

      - name: Run engine tests
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "::group::$f"
            PYTHONPATH=. python "$f"
            echo "::endgroup::"
          done

  swift-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd macos && xcodegen generate

      - name: Build macOS app
        run: xcodebuild -project macos/Veronica.xcodeproj -scheme Veronica -configuration Debug CODE_SIGNING_ALLOWED=NO build
