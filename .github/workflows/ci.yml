name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements/development.txt

      - name: Install media dependencies
        run: brew install ffmpeg handbrake exiftool

      - name: Verify media dependencies
        run: |
          ffmpeg -version
          ffprobe -version
          HandBrakeCLI --version

      - name: Synchronize bundled engine
        run: bash scripts/sync_engine_bundle.sh

      - name: Build and attest the frozen engine
        env:
          PYTHON_BIN: .venv/bin/python
        run: bash scripts/build_standalone_engine_macos.sh

      - name: Run source and release security regressions
        run: .venv/bin/python scripts/run_regressions.py

      - name: Check dependency advisories
        run: |
          python -m venv .build/audit-tools
          .build/audit-tools/bin/python -m pip install --require-hashes -r requirements/audit.txt
          .build/audit-tools/bin/pip-audit --no-deps --disable-pip -r requirements/development.txt

  swift-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd macos && xcodegen generate

      - name: Build macOS app
        run: xcodebuild -project macos/Veronica.xcodeproj -scheme Veronica -configuration Debug CODE_SIGNING_ALLOWED=NO build
